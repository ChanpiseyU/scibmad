name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install juliacall numpy pytest
          pip install . --no-deps

      - name: Install Julia packages
        run: |
          python - <<'PY'
          from juliacall import Main as jl
          jl.seval(
              '''
              import Pkg
              Pkg.Registry.update()
              Pkg.add([
                  Pkg.PackageSpec(name="DifferentiationInterface"),
                  Pkg.PackageSpec(name="ForwardDiff"),
                  Pkg.PackageSpec(url="https://github.com/bmad-sim/Beamlines.jl"),
                  Pkg.PackageSpec(url="https://github.com/bmad-sim/BeamTracking.jl"),
                  Pkg.PackageSpec(url="https://github.com/bmad-sim/SciBmad.jl"),
              ])
              '''
          )
          PY
      
      - name: Debug
        run: |
          python -c "import sys; print(sys.path)"
          python -c "import scibmad; print('scibmad ok')"
          python - <<'PY'
          from juliacall import Main as jl
          jl.seval("using Beamlines, BeamTracking, SciBmad")
          print("Beamlines", jl.seval('string(pkgversion(Beamlines))'))
          print("BeamTracking", jl.seval('string(pkgversion(BeamTracking))'))
          print("SciBmad", jl.seval('string(pkgversion(SciBmad))'))
          PY

      - name: Smoke test Julia-style beamline API
        run: |
          python - <<'PY'
          import scibmad as sb
          import torch

          torch.set_default_dtype(torch.float64)

          qf = sb.Quadrupole(Kn1=0.36, L=0.5)
          d = sb.Drift(L=1.2)
          qd = sb.Quadrupole(Kn1=-0.36, L=0.5)
          fodo = sb.Beamline(
              [qf, d, qd, d],
              E_ref=18e9,
              species_ref=sb.Species("electron"),
          )

          coords = torch.tensor([1e-3, 0.0, 1e-3, 0.0, 0.0, 0.0], requires_grad=True)
          k1 = torch.tensor(0.25, requires_grad=True)

          qf.Kn1 = k1
          qd.Kn1 = -k1

          result = sb.track(fodo, v0=coords)
          loss = result.v[0, :4, -1].sum()
          loss.backward()

          assert result.v.shape == (1, 6, 2)
          assert k1.grad is not None
          assert torch.isfinite(k1.grad)
          PY

      - name: Run tests
        run: pytest
